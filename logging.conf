[loggers]
keys=root,pyrogram,imdbpy,asyncio

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_pyrogram]
level=ERROR
handlers=consoleHandler
qualname=pyrogram
propagate=0

[logger_imdbpy]
level=ERROR
handlers=consoleHandler
qualname=imdbpy
propagate=0

[logger_asyncio]
level=CRITICAL
handlers=consoleHandler
qualname=asyncio
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=simpleFormatter
args=('bot.log', 'a')

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
